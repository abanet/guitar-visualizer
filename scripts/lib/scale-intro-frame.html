<!doctype html>
<html><head><meta charset="utf-8">
<!--
  Fotograma del capítulo 1 del vídeo largo de una posición (scripts/generate-scale-position-intro.js):
  la posición CAGED de la escala se va construyendo nota a nota. window.__DATA__ =
    { title, subtitle, caption, fretMin, fretMax, metro?: { bpm, beat 0..3 } (metrónomo visual, secuencias progresivas),
      notes: [{string, fret, label, isRoot, state: 'hidden'|'active'|'flash'|'ghost'}] }
  Estilo de nota = el de los vídeos (forceOwnNoteStyle): tónica rgba(229,57,53,.45), resto
  rgba(38,198,218,.5), borde blanco fino; fantasma = discontinuo blanco tenue, como el fondo de
  escala de los ejercicios de arpegios.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; background: #0d0d0d; overflow: hidden; font-family: Arial, Helvetica, sans-serif; }
  #title { position: absolute; top: 46px; left: 0; right: 0; text-align: center; font: 700 52px Arial; color: #8ab4ff; text-shadow: 0 0 18px rgba(120,160,255,.45); }
  #subtitle { position: absolute; top: 112px; left: 0; right: 0; text-align: center; font: 700 22px Arial; color: rgba(255,255,255,.6); letter-spacing: .04em; }
  #caption { position: absolute; top: 172px; left: 0; right: 0; text-align: center; font: 700 20px Arial; color: #e2b34f; min-height: 24px; }
  #big { position: absolute; top: 150px; left: 0; right: 0; text-align: center; font: 700 64px Arial; color: #8ab4ff; text-shadow: 0 0 20px rgba(120,160,255,.5); }
  #metro { position: absolute; left: 0; right: 0; bottom: 34px; display: flex; justify-content: center; align-items: center; gap: 18px; }
  #metro .bpm { font: 700 46px Arial; color: #e2b34f; margin-right: 14px; }
  #metro .bpm small { font: 700 22px Arial; color: rgba(226,179,79,.75); margin-left: 8px; }
  #metro .dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255,255,255,.45); background: rgba(255,255,255,.08); }
  #metro .dot.on { background: #26c6da; border-color: #fff; box-shadow: 0 0 16px rgba(38,198,218,.8); }
  #metro .dot.on.one { background: #e53935; box-shadow: 0 0 16px rgba(229,57,53,.8); }
  #brand { position: absolute; right: 26px; bottom: 18px; font: 700 15px Arial; color: #fff; }
  svg { position: absolute; left: 0; top: 0; }
</style></head>
<body>
<div id="title"></div><div id="subtitle"></div><div id="caption"></div><div id="big"></div>
<svg id="neck" width="1600" height="900"></svg>
<div id="metro"></div>
<div id="brand">@banetmasa</div>
<script>
const D = window.__DATA__;
document.getElementById('title').textContent = D.title;
document.getElementById('subtitle').textContent = D.subtitle;
document.getElementById('caption').textContent = D.caption || '';
document.getElementById('big').textContent = D.big || '';
if (D.metro) document.getElementById('metro').innerHTML = `<span class="bpm">${D.metro.bpm}<small>bpm</small></span>` + [0, 1, 2, 3].map(i => `<span class="dot${i === D.metro.beat ? ' on' + (i === 0 ? ' one' : '') : ''}"></span>`).join('');
// Placa pequeña con el intervalo (como appendIntervalBadge del reproductor / el dedo de los Drop2): círculo arriba a la derecha.
const badge = (x, y, iv, dim) => iv ? `<circle cx="${x + 22}" cy="${y - 22}" r="13" fill="rgba(20,20,20,.75)" stroke="rgba(255,255,255,.4)" stroke-width="1" opacity="${dim ? .55 : 1}"/><text x="${x + 22}" y="${y - 22 + 5}" text-anchor="middle" font-size="${iv.length > 1 ? 12 : 15}" font-weight="700" fill="#ffd640" opacity="${dim ? .55 : 1}" font-family="Helvetica,Arial,sans-serif">${iv}</text>` : '';
const LEFT = 150, RIGHT = 1450, TOP = 300, STR_GAP = 78;
const lo = D.fretMin, hi = D.fretMax, n = hi - lo + 1;
const fretW = (RIGHT - LEFT) / n;
const xOf = f => f === 0 ? LEFT - 30 : LEFT + (f - lo + 0.5) * fretW;   // lo..hi = casillas visibles
const yOf = s => TOP + (5 - s) * STR_GAP;                                 // s: 0 = 6ª (abajo) … 5 = 1ª (arriba)
let h = '';
const bot = yOf(0);
if (lo <= 1) h += `<line x1="${LEFT}" y1="${TOP - 10}" x2="${LEFT}" y2="${bot + 10}" stroke="rgba(255,255,255,.85)" stroke-width="7"/>`;
for (let i = (lo <= 1 ? 1 : 0); i <= n; i++) h += `<line x1="${LEFT + i * fretW}" y1="${TOP - 10}" x2="${LEFT + i * fretW}" y2="${bot + 10}" stroke="rgba(255,255,255,.35)" stroke-width="2"/>`;
for (let s = 0; s < 6; s++) h += `<line x1="${LEFT - (lo <= 1 ? 0 : 20)}" y1="${yOf(s)}" x2="${RIGHT + 20}" y2="${yOf(s)}" stroke="rgba(255,255,255,${0.3 + (5 - s) * 0.03})" stroke-width="${3.6 - s * 0.45}"/>`;
const inlay = (f, y) => `<circle cx="${xOf(f)}" cy="${y}" r="8" fill="rgba(255,255,255,.16)"/>`;
[3, 5, 7, 9, 15, 17].filter(f => f >= lo && f <= hi).forEach(f => h += inlay(f, (yOf(2) + yOf(3)) / 2));
if (12 >= lo && 12 <= hi) h += inlay(12, (yOf(1) + yOf(2)) / 2) + inlay(12, (yOf(3) + yOf(4)) / 2);
for (let f = Math.max(1, lo); f <= hi; f++) h += `<text x="${xOf(f)}" y="${bot + 56}" text-anchor="middle" font-size="22" fill="rgba(255,255,255,.45)">${f}</text>`;
const R = 30;
D.notes.forEach(nt => {
  if (nt.state === 'hidden') return;
  const x = xOf(nt.fret), y = yOf(nt.string);
  if (nt.state === 'ghost') {
    h += `<circle cx="${x}" cy="${y}" r="${R}" fill="#0d0d0d"/><circle cx="${x}" cy="${y}" r="${R}" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.5)" stroke-width="2" stroke-dasharray="6 4"/>`;
    h += `<text x="${x}" y="${y + 8}" text-anchor="middle" font-size="22" font-weight="700" fill="rgba(255,255,255,.6)">${nt.label}</text>`;
    if (D.badges) h += badge(x, y, nt.iv, true);
    return;
  }
  const flash = nt.state === 'flash';
  const fill = nt.isRoot ? `rgba(229,57,53,${flash ? .95 : .45})` : `rgba(38,198,218,${flash ? .95 : .5})`;
  if (flash) h += `<circle cx="${x}" cy="${y}" r="${R + 14}" fill="${nt.isRoot ? 'rgba(229,57,53,.25)' : 'rgba(38,198,218,.25)'}"/>`;
  h += `<circle cx="${x}" cy="${y}" r="${R}" fill="#0d0d0d"/><circle cx="${x}" cy="${y}" r="${R}" fill="${fill}" stroke="${flash ? '#fff' : 'rgba(255,255,255,.25)'}" stroke-width="${flash ? 3 : 1.2}"/>`;
  h += `<text x="${x}" y="${y + 8}" text-anchor="middle" font-size="24" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#fff">${nt.label}</text>`;
  if (D.badges) h += badge(x, y, nt.iv, false);
});
document.getElementById('neck').innerHTML = h;
</script>
</body></html>
