<!doctype html>
<html><head><meta charset="utf-8">
<!--
  Fotograma del capítulo 1 del vídeo largo de una posición (scripts/generate-scale-position-intro.js):
  la posición CAGED de la escala se va construyendo nota a nota. window.__DATA__ =
    { title, subtitle, caption, fretMin, fretMax, metro?: { bpm, beat 0..3, next? } (metrónomo visual arriba a la derecha, secuencias progresivas),
      strip?: { items: [{label, sub}], on: [índices encendidos], q?: 'may'|'men' (calidad de la tercera), pill } (fila de notas/acordes de la escala),
      ladder?: { tempos: [...], cur } (escalera de tempos abajo),
      notes: [{string, fret, label, isRoot, state: 'hidden'|'active'|'flash'|'ghost'|'next'|'soon'}] }
  'next' / 'soon' = fantasma con aro ámbar (fuerte / tenue): las notas que vienen a continuación.
  'pend' = nota del grupo en curso que aún no ha sonado: mismo color que la activa, muy tenue.
  ring: true = pista de la 1ª nota del grupo siguiente: borde discontinuo y letra en blanco pleno.
  Estilo de nota = el de los vídeos (forceOwnNoteStyle): tónica rgba(229,57,53,.45), resto
  rgba(38,198,218,.5), borde blanco fino; fantasma = discontinuo blanco tenue, como el fondo de
  escala de los ejercicios de arpegios.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; background: #0d0d0d; overflow: hidden; font-family: Arial, Helvetica, sans-serif; }
  #title { position: absolute; top: 46px; left: 0; right: 0; text-align: center; font: 700 52px Arial; color: #8ab4ff; text-shadow: 0 0 18px rgba(120,160,255,.45); }
  #subtitle { position: absolute; top: 112px; left: 0; right: 0; text-align: center; font: 700 22px Arial; color: rgba(255,255,255,.6); letter-spacing: .04em; }
  #caption { position: absolute; top: 172px; left: 0; right: 0; text-align: center; font: 700 20px Arial; color: #e2b34f; min-height: 24px; }
  #big { position: absolute; top: 150px; left: 0; right: 0; text-align: center; font: 700 64px Arial; color: #8ab4ff; text-shadow: 0 0 20px rgba(120,160,255,.5); }
  #metro { position: absolute; right: 44px; top: 34px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  #metro .bpm { font: 700 46px Arial; color: #e2b34f; line-height: 46px; }
  #metro .bpm small { font: 700 22px Arial; color: rgba(226,179,79,.75); margin-left: 8px; }
  #metro .dots { display: flex; gap: 12px; }
  #metro .dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255,255,255,.45); background: rgba(255,255,255,.08); }
  #metro .dot.on { background: #26c6da; border-color: #fff; box-shadow: 0 0 16px rgba(38,198,218,.8); }
  #metro .dot.on.one { background: #e53935; box-shadow: 0 0 16px rgba(229,57,53,.8); }
  #metro .next { font: 700 17px Arial; color: rgba(226,179,79,.95); white-space: nowrap; margin-top: 2px; }
  #strip { position: absolute; top: 168px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 10px; }
  #strip .it { min-width: 84px; height: 58px; padding: 0 10px; border-radius: 10px; border: 2px solid rgba(255,255,255,.28); background: rgba(255,255,255,.06); display: flex; flex-direction: column; justify-content: center; align-items: center; }
  #strip .it b { font: 700 24px Arial; color: rgba(255,255,255,.72); line-height: 26px; }
  #strip .it small { font: 700 13px Arial; color: rgba(255,255,255,.42); line-height: 15px; }
  #strip .it.on { background: #e2b34f; border-color: #fff; box-shadow: 0 0 18px rgba(226,179,79,.7); }
  #strip .it.on b { color: #111; } #strip .it.on small { color: rgba(0,0,0,.6); }
  #strip .it.on.may { background: #ffa726; box-shadow: 0 0 18px rgba(255,167,38,.75); }
  #strip .it.on.men { background: #7e9bff; box-shadow: 0 0 18px rgba(126,155,255,.75); }
  #strip .q { width: 150px; margin-left: 14px; height: 44px; border-radius: 22px; font: 700 21px Arial; color: #111; display: flex; justify-content: center; align-items: center; visibility: hidden; }
  #strip .q.may { visibility: visible; background: #ffa726; } #strip .q.men { visibility: visible; background: #7e9bff; }
  #ladder { position: absolute; left: 0; right: 0; bottom: 44px; display: flex; justify-content: center; align-items: center; gap: 6px; }
  #ladder .t { width: 58px; height: 34px; border-radius: 8px; border: 2px solid rgba(255,255,255,.22); font: 700 17px Arial; color: rgba(255,255,255,.45); display: flex; justify-content: center; align-items: center; }
  #ladder .t.done { background: rgba(38,198,218,.28); border-color: rgba(38,198,218,.55); color: rgba(255,255,255,.8); }
  #ladder .t.cur { background: #e2b34f; border-color: #fff; color: #111; box-shadow: 0 0 16px rgba(226,179,79,.7); }
  #ladder .lbl { font: 700 15px Arial; color: rgba(255,255,255,.45); margin: 0 8px; letter-spacing: .04em; }
  #brand { position: absolute; right: 26px; bottom: 18px; font: 700 15px Arial; color: #fff; }
  svg { position: absolute; left: 0; top: 0; }
</style></head>
<body>
<div id="title"></div><div id="subtitle"></div><div id="caption"></div><div id="strip"></div><div id="big"></div>
<svg id="neck" width="1600" height="900"></svg>
<div id="metro"></div><div id="ladder"></div>
<div id="brand">@banetmasa</div>
<script>
// render(D) se puede volver a llamar con otros datos sobre la misma página (los generadores con muchos
// fotogramas reutilizan la página en vez de abrir una por fotograma).
function render(D) {
document.getElementById('title').textContent = D.title;
document.getElementById('subtitle').textContent = D.subtitle;
document.getElementById('caption').textContent = D.caption || '';
document.getElementById('big').textContent = D.big || '';
document.getElementById('metro').innerHTML = !D.metro ? '' : `<span class="bpm">${D.metro.bpm}<small>bpm</small></span><span class="dots">`
  + [0, 1, 2, 3].map(i => `<span class="dot${i === D.metro.beat ? ' on' + (i === 0 ? ' one' : '') : ''}"></span>`).join('') + '</span>'
  + (D.metro.next ? `<span class="next">siguiente vuelta: ${D.metro.next} bpm</span>` : '');
const L = D.ladder;
document.getElementById('ladder').innerHTML = !L ? '' : '<span class="lbl">bpm</span>' + L.tempos.map((t, i) => `<span class="t${i < L.cur ? ' done' : i === L.cur ? ' cur' : ''}">${t}</span>`).join('');
const S = D.strip;
document.getElementById('strip').innerHTML = !S ? '' : S.items.map((it, i) => `<span class="it${S.on.includes(i) ? ' on' + (S.q ? ' ' + S.q : '') : ''}"><b>${it.label}</b><small>${it.sub}</small></span>`).join('')
  + (S.pill ? `<span class="q ${S.q || ''}">${S.q ? '3ª ' + (S.q === 'may' ? 'mayor' : 'menor') : ''}</span>` : '');
// Placa pequeña con el intervalo (como appendIntervalBadge del reproductor / el dedo de los Drop2): círculo arriba a la derecha.
const badge = (x, y, iv, dim) => iv ? `<circle cx="${x + 22}" cy="${y - 22}" r="13" fill="rgba(20,20,20,.75)" stroke="rgba(255,255,255,.4)" stroke-width="1" opacity="${dim ? .55 : 1}"/><text x="${x + 22}" y="${y - 22 + 5}" text-anchor="middle" font-size="${iv.length > 1 ? 12 : 15}" font-weight="700" fill="#ffd640" opacity="${dim ? .55 : 1}" font-family="Helvetica,Arial,sans-serif">${iv}</text>` : '';
const LEFT = 150, RIGHT = 1450, TOP = 300, STR_GAP = 78;
const lo = D.fretMin, hi = D.fretMax, n = hi - lo + 1;
const fretW = (RIGHT - LEFT) / n;
const xOf = f => f === 0 ? LEFT - 30 : LEFT + (f - lo + 0.5) * fretW;   // lo..hi = casillas visibles
const yOf = s => TOP + (5 - s) * STR_GAP;                                 // s: 0 = 6ª (abajo) … 5 = 1ª (arriba)
let h = '';
const bot = yOf(0);
if (lo <= 1) h += `<line x1="${LEFT}" y1="${TOP - 10}" x2="${LEFT}" y2="${bot + 10}" stroke="rgba(255,255,255,.85)" stroke-width="7"/>`;
for (let i = (lo <= 1 ? 1 : 0); i <= n; i++) h += `<line x1="${LEFT + i * fretW}" y1="${TOP - 10}" x2="${LEFT + i * fretW}" y2="${bot + 10}" stroke="rgba(255,255,255,.35)" stroke-width="2"/>`;
for (let s = 0; s < 6; s++) h += `<line x1="${LEFT - (lo <= 1 ? 0 : 20)}" y1="${yOf(s)}" x2="${RIGHT + 20}" y2="${yOf(s)}" stroke="rgba(255,255,255,${0.3 + (5 - s) * 0.03})" stroke-width="${3.6 - s * 0.45}"/>`;
const inlay = (f, y) => `<circle cx="${xOf(f)}" cy="${y}" r="8" fill="rgba(255,255,255,.16)"/>`;
[3, 5, 7, 9, 15, 17].filter(f => f >= lo && f <= hi).forEach(f => h += inlay(f, (yOf(2) + yOf(3)) / 2));
if (12 >= lo && 12 <= hi) h += inlay(12, (yOf(1) + yOf(2)) / 2) + inlay(12, (yOf(3) + yOf(4)) / 2);
for (let f = Math.max(1, lo); f <= hi; f++) h += `<text x="${xOf(f)}" y="${bot + 56}" text-anchor="middle" font-size="22" fill="rgba(255,255,255,.45)">${f}</text>`;
const R = 30;
const ringOf = (nt, x, y) => nt.ring ? `<circle cx="${x}" cy="${y}" r="${R}" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="6 4"/>` : '';   // pista discreta: el borde discontinuo del fantasma, en blanco
D.notes.forEach(nt => {
  if (nt.state === 'hidden') return;
  const x = xOf(nt.fret), y = yOf(nt.string);
  if (nt.state === 'ghost' || nt.state === 'next' || nt.state === 'soon') {
    h += `<circle cx="${x}" cy="${y}" r="${R}" fill="#0d0d0d"/><circle cx="${x}" cy="${y}" r="${R}" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.5)" stroke-width="2" stroke-dasharray="6 4"/>`;
    h += `<text x="${x}" y="${y + 8}" text-anchor="middle" font-size="22" font-weight="700" fill="rgba(255,255,255,${nt.ring ? 1 : .6})">${nt.label}</text>`;
    if (nt.state !== 'ghost') h += `<circle cx="${x}" cy="${y}" r="${R + 6}" fill="none" stroke="#e2b34f" stroke-width="${nt.state === 'next' ? 4 : 2.5}" opacity="${nt.state === 'next' ? .95 : .5}"/>`;
    h += ringOf(nt, x, y);
    if (D.badges) h += badge(x, y, nt.iv, true);
    return;
  }
  const flash = nt.state === 'flash', pend = nt.state === 'pend';
  const fill = nt.isRoot ? `rgba(229,57,53,${flash ? .95 : pend ? .12 : .45})` : `rgba(38,198,218,${flash ? .95 : pend ? .12 : .5})`;
  if (flash) h += `<circle cx="${x}" cy="${y}" r="${R + 14}" fill="${nt.isRoot ? 'rgba(229,57,53,.25)' : 'rgba(38,198,218,.25)'}"/>`;
  h += `<circle cx="${x}" cy="${y}" r="${R}" fill="#0d0d0d"/><circle cx="${x}" cy="${y}" r="${R}" fill="${fill}" stroke="${flash ? '#fff' : 'rgba(255,255,255,.25)'}" stroke-width="${flash ? 3 : 1.2}"/>`;
  h += `<text x="${x}" y="${y + 8}" text-anchor="middle" font-size="24" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="${pend ? 'rgba(255,255,255,.6)' : '#fff'}">${nt.label}</text>`;
  h += ringOf(nt, x, y);
  if (D.badges) h += badge(x, y, nt.iv, false);
});
document.getElementById('neck').innerHTML = h;
}
if (window.__DATA__) render(window.__DATA__);
</script>
</body></html>
