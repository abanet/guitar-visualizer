<!doctype html>
<html><head><meta charset="utf-8">
<!--
  Miniatura de "Localiza la tónica" por forma (scripts/generate-localiza-tonica-thumbnails.js): sobre la
  plantilla de Alberto de cada forma (1672×941, "TÓNICAS DE LOS ACORDES EN LA ESCALA MAYOR · TONALIDAD: _ ·
  FORMA: C A G E D" con la forma resaltada) se escribe la tonalidad en la píldora amarilla, detrás de
  "TONALIDAD:". Cada plantilla es una imagen generada aparte: el final de "TONALIDAD:" y el centro de la
  píldora se MIDEN por plantilla (el script pasa x/y); la píldora sube ~7°, igual que su texto.
-->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 1672px; height: 941px; overflow: hidden; background: #fff; }
  #bg { position: absolute; inset: 0; width: 1672px; height: 941px; }
  /* Como la "G" del ejemplo de Alberto (Plantilla_Rellena): azul marino, muy gruesa, ~85 px de alto. */
  #tono { position: absolute; transform: translate(0, -50%) rotate(-7deg); transform-origin: 0 50%;
    font: 900 118px/1 Montserrat, sans-serif; color: #15213a; white-space: nowrap; letter-spacing: -2px; }
  #tono .alt { font-size: .62em; vertical-align: .42em; margin-left: 2px; letter-spacing: 0; }
</style></head>
<body>
<img id="bg"><div id="tono"></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('bg').src = q.get('bg');
  const t = q.get('tono'), el = document.getElementById('tono');
  el.style.left = q.get('x') + 'px'; el.style.top = q.get('y') + 'px';
  el.innerHTML = t[0] + (t.length > 1 ? `<span class="alt">${t.slice(1)}</span>` : '');
</script>
</body></html>
