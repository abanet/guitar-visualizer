<!doctype html>
<html><head><meta charset="utf-8">
<!--
  Miniatura de "Tríadas en 4 mástiles" (scripts/generate-triadas4m-thumbnails.js): sobre la plantilla
  vacía de Alberto (1672×941, "TRIADAS EN TODO EL MÁSTIL" + 4 mástiles) se escribe el acorde debajo del
  título, como en su ejemplo "Cm": tónica en blanco y calidad (m, dim, aug) en turquesa, centrado en
  x≈544 con la base en y≈812 (medido sobre PlantillaRellena.png).
-->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 1672px; height: 941px; overflow: hidden; background: #000; }
  #bg { position: absolute; inset: 0; width: 1672px; height: 941px; }
  #chord { position: absolute; left: 544px; bottom: calc(941px - 818px); transform: translateX(-50%);
    font: 900 var(--size, 300px)/0.74 Montserrat, sans-serif; letter-spacing: -10px; white-space: nowrap;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,.85)); }
  #chord .r { background: linear-gradient(180deg, #ffffff 0%, #f2ede4 60%, #cfc8bb 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #chord .alt { font-size: .55em; vertical-align: .55em; letter-spacing: 0; margin-left: 2px; }
  #chord .q { font-size: .72em; letter-spacing: -4px; margin-left: 6px;
    background: linear-gradient(180deg, #2de0f5 0%, #10c4e0 55%, #06b3d0 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style></head>
<body>
<img id="bg">
<div id="chord"></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('bg').src = q.get('bg');
  const m = (q.get('chord') || 'C').match(/^([A-G])([#b]?)(.*)$/);
  const qual = m[3];
  // Más largo el nombre, más pequeño: "C" y "Cm" a tamaño completo, "F#dim"/"Bbaug" reducidos para
  // no invadir los mástiles (x ≤ 820).
  const size = { '': 330, 'm': 320, 'dim': 235, 'aug': 235 }[qual] - (m[2] ? 30 : 0);
  const el = document.getElementById('chord');
  el.style.setProperty('--size', size + 'px');
  el.innerHTML = `<span class="r">${m[1]}${m[2] ? `<span class="alt">${m[2]}</span>` : ''}</span>` + (qual ? `<span class="q">${qual}</span>` : '');
</script>
</body></html>
